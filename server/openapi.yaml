openapi: 3.1.0
info:
  title: PATRON Secure Actions
  version: "14.0.0"
servers:
  - url: https://patron-api.onrender.com
paths:
  /validateSubscription:
    post:
      summary: Validate access and issue a short-lived session token for Split-Knowledge mode
      operationId: checkSubscriptionStatus
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                message:
                  type: string
                payment_token:
                  type: string
                stripe_customer_id:
                  type: string
                stripe_email:
                  type: string
                oab_number:
                  type: string
      responses:
        "200":
          description: Validation result for the current session
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ok | denied | blocked | needs_registration
                  session_token:
                    type: string
                    description: Short-lived token for the active session
                  expires_in_seconds:
                    type: integer
                  reason:
                    type: string
                  registration_url:
                    type: string
                  cfg:
                    type: string
                    description: Encoded operational configuration for the current session
                  sk:
                    type: string
                    description: Split-Knowledge scheme key for the current session
  /blockUser:
    post:
      summary: Block a user (admin use)
      operationId: adminBlockUser
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, reason]
              properties:
                user_id:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
