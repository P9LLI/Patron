openapi: 3.1.0
info:
  title: PATRON Secure Actions
  version: "14.2.0"
servers:
  - url: https://patron-api.onrender.com
paths:
  /validateSubscription:
    post:
      summary: Validate access and return only minimal operational mode
      operationId: checkSubscriptionStatus
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                message:
                  type: string
                stripe_email:
                  type: string
                oab_number:
                  type: string
                oab_state:
                  type: string
      responses:
        "200":
          description: Minimal validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ok | needs_registration | denied | blocked
                  mode:
                    type: string
                    description: Short opaque runtime mode code, returned only when status is ok
                  registration_url:
                    type: string
                    description: Returned only when status is needs_registration
                  reason:
                    type: string
  /blockUser:
    post:
      summary: Block a user (admin use)
      operationId: adminBlockUser
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, reason]
              properties:
                user_id:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
